name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Monorepo Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma Schema Validation
        run: npm run prisma:validate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stockpilot_test"

      - name: Prisma Client Generation
        run: npm run prisma:generate

      - name: Code Formatting Check
        run: npm run format:check

      - name: Monorepo Linting
        run: npm run lint

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Monorepo Build
        run: npm run build

      - name: Backend Unit Tests
        run: npm run test:unit -w @stockpilot/api

      - name: Backend Integration Tests
        run: npm run test:integration -w @stockpilot/api

      - name: Shared Library Tests
        run: npm test -w @stockpilot/shared

      - name: Full Monorepo Test Suite
        run: npm test
