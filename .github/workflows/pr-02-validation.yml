name: PR 02 Backend Bootstrap Validation

on:
  pull_request:

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @stockpilot/api

      - name: Format Check
        run: npm run format:check -w @stockpilot/api

      - name: Build
        run: npm run build -w @stockpilot/api
