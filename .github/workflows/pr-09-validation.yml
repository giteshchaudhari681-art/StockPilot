name: PR 09 Testing Foundation Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-testing-foundation:
    name: Validate Testing Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Shared Package Format Check
        run: npm run format:check -w @stockpilot/shared

      - name: Shared Package Lint
        run: npm run lint -w @stockpilot/shared

      - name: Shared Package Typecheck
        run: npm run typecheck -w @stockpilot/shared

      - name: Shared Package Build
        run: npm run build -w @stockpilot/shared

      - name: Shared Package Test
        run: npm run test -w @stockpilot/shared

      - name: Backend Format Check
        run: npm run format:check -w @stockpilot/api

      - name: Backend Typecheck
        run: npm run typecheck -w @stockpilot/api

      - name: Backend Build
        run: npm run build -w @stockpilot/api

      - name: Backend Unit Tests
        run: npm run test:unit -w @stockpilot/api

      - name: Backend Integration Tests
        run: npm run test:integration -w @stockpilot/api

      - name: Backend Full Test Suite
        run: npm run test -w @stockpilot/api

      - name: Frontend Typecheck
        run: npm run typecheck -w @stockpilot/web

      - name: Frontend Build
        run: npm run build -w @stockpilot/web

      - name: Root Format Check
        run: npm run format:check

      - name: Root Typecheck
        run: npm run typecheck

      - name: Root Monorepo Test
        run: npm test
